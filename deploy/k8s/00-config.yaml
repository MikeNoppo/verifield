apiVersion: v1
kind: ConfigMap
metadata:
  name: verifield-config
data:
  APP_ENV: "production"
  # Zona operasi lapangan. Image backend memuat tzdata agar zona ini benar-benar
  # dapat dimuat — tanpa paket itu Go jatuh ke UTC dan aturan jam kerja meleset
  # tujuh jam.
  APP_TIMEZONE: "Asia/Jakarta"
  HTTP_HOST: "0.0.0.0"
  HTTP_PORT: "8080"
  HTTP_ALLOWED_ORIGINS: "https://verifield.example.id"
  DB_HOST: "postgres.database.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "verifield"
  DB_SSLMODE: "require"
  DB_TIMEZONE: "Asia/Jakarta"
  # Pool per pod. Satu koneksi tambahan di luar pool dipakai listener
  # LISTEN/NOTIFY, yang memegang koneksinya sepanjang waktu.
  DB_MAX_OPEN_CONNS: "20"
  DB_MAX_IDLE_CONNS: "5"
---
apiVersion: v1
kind: Secret
metadata:
  name: verifield-secret
type: Opaque
stringData:
  # CONTOH. Di produksi nilai ini datang dari External Secrets, Sealed Secrets,
  # atau penyedia cloud — tidak pernah dari repositori.
  DB_USER: "verifield"
  DB_PASSWORD: "ganti-lewat-secret-manager"
  SEED_ADMIN_EMAIL: "admin@verifield.id"
  SEED_ADMIN_PASSWORD: "ganti-lewat-secret-manager"
