name: CI

on:
  push:
    branches: [main]
  pull_request:

# Push berturut-turut pada branch yang sama membatalkan run sebelumnya —
# tidak ada gunanya menunggu hasil untuk commit yang sudah tertimpa.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/backend/go.mod
          cache-dependency-path: apps/backend/go.sum

      # gofmt -l mencetak berkas yang belum rapi dan tetap keluar dengan status
      # 0, jadi keluarannya yang harus diperiksa — bukan exit code-nya.
      - name: Periksa format
        run: |
          offenders=$(gofmt -l .)
          if [ -n "$offenders" ]; then
            echo "Berkas berikut belum diformat:"
            echo "$offenders"
            exit 1
          fi

      - name: Analisis statis
        run: go vet ./...

      # Kedua suite berjalan tanpa database: modul diuji lewat stub, dan berkas
      # migrasi diperiksa dari isinya.
      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build ./...

      # Spesifikasi API lahir dari anotasi pada handler. Bila anotasinya berubah
      # tetapi berkas hasil generate tidak ikut di-commit, kontrak yang dipakai
      # frontend diam-diam menggambarkan API versi lama.
      - name: Spesifikasi API selaras dengan anotasi
        run: |
          go run github.com/swaggo/swag/cmd/swag@v1.16.4 init \
            -g cmd/api/main.go -o docs --parseDependency --parseInternal
          git diff --exit-code docs/ \
            || { echo "Jalankan 'bun run swagger' lalu commit hasilnya."; exit 1; }

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - run: bun install --frozen-lockfile

      # Penjaga sesungguhnya dari paket kontrak: tipe TypeScript yang ter-commit
      # harus masih sesuai dengan spesifikasi. Tanpa langkah ini, tipe itu hanya
      # menyalin keadaan pada suatu saat, bukan menjaganya tetap sama.
      - name: Kontrak selaras dengan spesifikasi
        run: bun run contract:check

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      # Install dijalankan dari akar: dependency-nya milik workspace, dan
      # frontend memakai paket kontrak lewat tautan workspace.
      - run: bun install --frozen-lockfile

      - name: Lint
        run: bun run --filter @verifield/frontend lint

      - name: Periksa tipe
        run: bun run --filter @verifield/frontend typecheck

      - name: Test
        run: bun run --filter @verifield/frontend test

      - name: Build
        run: bun run --filter @verifield/frontend build

  images:
    # Image hanya dibangun setelah semuanya lolos — tidak ada gunanya mengemas
    # kode yang belum tentu benar.
    needs: [backend, contract, frontend]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - component: backend
            context: ./apps/backend
            dockerfile: ./apps/backend/Dockerfile
          # Konteks frontend adalah akar repo: lockfile dan paket kontrak berada
          # di luar apps/frontend, dan keduanya dibutuhkan saat install.
          - component: frontend
            context: .
            dockerfile: ./apps/frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Belum di-push ke registry: kredensialnya milik lingkungan yang belum ada.
      # Yang dijaga di sini adalah Dockerfile-nya tetap bisa dibangun.
      - name: Build image ${{ matrix.component }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          tags: verifield-${{ matrix.component }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,scope=${{ matrix.component }},mode=max
