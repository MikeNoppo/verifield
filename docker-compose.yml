# Stack Verifield. Layanan aplikasi menyusul; untuk sekarang berkas ini
# menyediakan database yang dibutuhkan backend, migrasi, dan seeder.
#
#   docker compose up -d postgres

name: verifield

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-verifield}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/init-atlas-dev-db.sql:/docker-entrypoint-initdb.d/10-atlas-dev-db.sql:ro
    healthcheck:
      # Layanan lain menunggu kondisi ini, bukan sekadar menunggu port terbuka —
      # Postgres membuka port sebelum benar-benar siap menerima query.
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-verifield}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
