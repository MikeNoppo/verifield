# Seluruh stack Verifield:
#
#   docker compose up        seluruh tumpukan, lalu buka http://localhost:3000
#   docker compose up postgres   database saja, untuk pengembangan dengan hot reload
#
# Migrasi dan seeding berjalan di dalam container backend lewat
# docker-entrypoint.sh (keduanya idempoten), sehingga stack hanya terdiri dari
# tiga container: postgres, backend, frontend.
#
# Urutannya dirantai lewat kondisi kesehatan, bukan lewat jeda waktu: backend
# menunggu database benar-benar siap menerima query, dan frontend menunggu API
# menyala.

name: verifield

x-db-env: &db-env
  DB_HOST: postgres
  DB_PORT: 5432
  DB_USER: ${DB_USER:-postgres}
  DB_PASSWORD: ${DB_PASSWORD:-postgres}
  DB_NAME: ${DB_NAME:-verifield}
  DB_SSLMODE: disable
  DB_TIMEZONE: ${DB_TIMEZONE:-Asia/Jakarta}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-verifield}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/init-atlas-dev-db.sql:/docker-entrypoint-initdb.d/10-atlas-dev-db.sql:ro
    healthcheck:
      # pg_isready, bukan sekadar menunggu port terbuka — Postgres membuka
      # portnya sebelum benar-benar siap menerima query.
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-verifield}"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Menerapkan migrasi, mengisi data contoh, lalu menjalankan API — lihat
  # apps/backend/docker-entrypoint.sh. Kedua langkah idempoten, jadi aman
  # dijalankan ulang setiap container ini dinyalakan.
  backend:
    build:
      context: ./apps/backend
    environment:
      <<: *db-env
      APP_ENV: ${APP_ENV:-development}
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 8080
      # Browser mengakses backend langsung untuk stream SSE, sehingga origin
      # frontend harus diizinkan secara eksplisit.
      HTTP_ALLOWED_ORIGINS: ${FRONTEND_ORIGIN:-http://localhost:3000}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Administrator}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@verifield.id}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-verifield123}
    entrypoint: ["/usr/local/bin/docker-entrypoint.sh"]
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    # Koneksi SSE ditutup rapi saat container dihentikan; klien lalu menyambung
    # ulang dan memulihkan diri lewat kursor.
    stop_grace_period: 30s

  frontend:
    build:
      # Konteksnya akar repo: lockfile dan paket kontrak berada di luar
      # apps/frontend, dan keduanya dibutuhkan saat install.
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        # Nilai ini terpanggang saat build karena dibaca dari browser, bukan
        # dari dalam container.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080/api/v1}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
